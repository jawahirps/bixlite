# XcodeGen fallback: `brew install xcodegen && cd ios && xcodegen generate`
name: BIXLite
options:
  bundleIdPrefix: com.ghafservices
  deploymentTarget:
    iOS: "17.0"
targets:
  BIXLite:
    type: application
    platform: iOS
    sources:
      - path: BIXLite
    info:
      path: BIXLite-Info.plist
      properties:
        CFBundleDisplayName: BIX Lite
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.business
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.ghafservices.bixlite
            CFBundleURLSchemes: [bixlite]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghafservices.bixlite
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
